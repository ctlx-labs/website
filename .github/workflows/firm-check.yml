# Stamped from ctlxholdings/claude settings/firm/ci/. Runs the firm check on every pull request.
# It blocks merging once branch protection requires it (GitHub Pro or Team).
name: firm-check
# Runs on pull requests only: main changes only by PR (ruleset), so a second run on merge repeats the same check.
# A newer push to the same PR cancels the older run. Both save Actions minutes (billed per started minute).
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]  # edited: rule 7 reads the PR body
concurrency:
  group: firm-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  firm-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: YAML parser for rule 14 (PyYAML, MIT)
        run: python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet pyyaml
      - env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 .claude/checks/firm_check.py --base origin/${{ github.base_ref || 'main' }}
      - name: Hook self-test (agent_rules.py)
        run: "[ ! -f .claude/hooks/agent_rules.py ] || python3 .claude/hooks/agent_rules.py --self-test"
      - name: Hook self-test (key_guard.py)
        run: "[ ! -f .claude/hooks/key_guard.py ] || python3 .claude/hooks/key_guard.py --self-test"
      - name: Hook self-test (protect_records.py)
        run: "[ ! -f .claude/hooks/protect_records.py ] || ! grep -q -- --self-test .claude/hooks/protect_records.py || python3 .claude/hooks/protect_records.py --self-test"
      - name: Secret scan of this PR's commits (gitleaks, MIT; radar trial)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --no-banner \
            --log-opts="origin/${{ github.base_ref || 'main' }}..HEAD"
